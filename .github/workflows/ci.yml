name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt || pip install pytest pytest-cov ruff

    - name: Lint with ruff
      run: ruff check wifi_jammer/ --select E9,F63,F7,F82 --ignore E501
    - name: Enforce module-size ratchet
      run: python tools/check_module_size.py --limit 900

    - name: Type check with mypy
      run: |
        pip install mypy
        mypy --strict wifi_jammer/

    - name: Security audit with pip-audit (advisory here; blocking gate is the scheduled 'security' job)
      continue-on-error: true
      run: |
        pip install pip-audit
        pip-audit --desc --format=json --output=pip-audit.json

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --tb=short --cov=wifi_jammer --cov-report=term-missing --cov-report=xml --cov-fail-under=45
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Upload pip-audit results
      uses: actions/upload-artifact@v4
      with:
        name: pip-audit-results
        path: pip-audit.json
        retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  security:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-audit

    - name: Full security audit
      run: |
        pip-audit --desc --format=json --output=security-audit.json
        cat security-audit.json | jq '.vulnerabilities | length'

    - name: Upload security audit
      uses: actions/upload-artifact@v4
      with:
        name: security-audit
        path: security-audit.json
        retention-days: 30